  <script>
    // Sticky header: toggles the class only when the state actually changes
    (function () {
      var sticky = false, ticking = false;
      function update() {
        var nav = document.getElementById('hx-header');
        ticking = false;
        if (!nav) return;
        var shouldStick = window.scrollY > 100;
        if (shouldStick !== sticky) {
          sticky = shouldStick;
          nav.classList.toggle('hx-sticky', sticky);
        }
      }
      window.addEventListener('scroll', function () {
        if (!ticking) { ticking = true; requestAnimationFrame(update); }
      }, { passive: true });
    })();
  </script>
